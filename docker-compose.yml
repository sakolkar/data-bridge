services:
  sftp:
    image: atmoz/sftp:alpine-3.7
    ports:
      - "8822:22"
    command: testuser:testpass:100010
    volumes:
      - ./.databridge/sftp:/home/testuser/data
    restart: unless-stopped
  databridge:
    build: ./data-bridge
    image: data-bridge:local
    environment:
      DATABRIDGE_SECRET_KEY: ${DATABRIDGE_SECRET_KEY:-LGV0e84Z6Dyv1zXPyrjUnW75clrMQQ8LINNNaLtvTKQ=}
      DATABRIDGE_SQLITE_PATH: /var/lib/databridge/db.sqlite
    volumes:
      - ./.databridge/local:/var/lib/databridge
    ports:
      - 8000:8000

# {"name":"a","type":"sftp","host":"sftp","port":22,"username":"testuser","password":"testpass"}
# {"name":"b", "type": "local", "path": "/var/lib/databridge"}
